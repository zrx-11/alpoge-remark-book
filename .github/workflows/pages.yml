name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 组装站点
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          touch _site/.nojekyll
          if [ -f book.pdf ]; then
            cp book.pdf _site/book.pdf
            echo "using repo book.pdf"
          else
            curl -fL --retry 3 -o _site/book.pdf "https://aka.doubaocdn.com/s/ZRwtxIKQgb" || echo "pdf fetch failed, page will link to CDN"
          fi
          ls -lh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
